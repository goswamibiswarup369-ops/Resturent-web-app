<!-- Same head/header -->
<main>
    <section class="hero" style="background-image: url('images/contact-bg.webp');">
        <h1>Get In Touch</h1>
        <p>Reservations or inquiries: +91-123-456-7890</p>
    </section>
    <section class="form-section">
        <form id="contactForm" novalidate aria-label="Contact form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required aria-required="true">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required aria-required="true">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required aria-required="true" placeholder="e.g., Table for 4 at 7 PM"></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>
</main>
<!-- Footer/script -->
